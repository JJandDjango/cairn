name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      # Activates the PromptLang conformance gate: tests/test_promptlang.py
      # importorskips prompt_lang, so without this install it skips (the
      # zero-dependency contract for strangers); with it, the gate enforces.
      - name: Install foundations
        run: pip install git+https://github.com/JJandDjango/foundations

      - name: Run tests
        run: python -m pytest -v --tb=short

      # Cairn dogfoods its own 2.0 spine: the repo must audit clean.
      - name: Audit the docs spine
        run: python skills/cairn/audit.py --cwd .
