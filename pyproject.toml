# Cairn - pytest configuration.
#
# Cairn is zero-dependency (skills/cairn/*.py) and needs no packaging. The
# skill dir is put on the import path here so the tests can `import render`
# and `import audit`. `pythonpath` is resolved relative to this file (the
# rootdir).
#
# Version + plugin manifest: `.claude-plugin/plugin.json` is the single source of
# truth. This file is pytest config only - NOT a package manifest (no [project]).
[tool.pytest.ini_options]
pythonpath = ["skills/cairn"]
testpaths = ["tests"]
